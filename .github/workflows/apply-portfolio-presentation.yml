name: Apply portfolio presentation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-portfolio-presentation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert hardcoded company blocks to conditional mounts
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'suaveforgeHeaderBrandMount' not in s:
              s=re.sub(r'<a aria-label="SuaveForge 홈" class="brand" href="#top">.*?</a>', '<span id="suaveforgeHeaderBrandMount"></span>', s, count=1, flags=re.S)
          if 'suaveforgeFooterMount' not in s:
              s=re.sub(r'<footer class="site-footer">.*?</footer>', '<footer class="site-footer" id="suaveforgeFooterMount"></footer>', s, count=1, flags=re.S)
          tag='<script src="assets/portfolio-presentation.js"></script>'
          if tag not in s: s=s.replace('</head>',tag+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Apply conditional portfolio presentation"
          git push
