name: Integrate SiteHub p10 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sitehub-p10-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch initial head
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); h=p.read_text(encoding='utf-8')
          if 'data-sitehub-project="p10"' in h: raise SystemExit(0)
          desc='Windows 데스크톱 AI 콘텐츠 자동 생성 및 사고사진 개인정보 모자이크 프로그램'
          block='''\n<link rel="canonical" href="https://acs.suaveforge.com/"/>\n<meta property="og:title" content="사고 콘텐츠 스튜디오 | Windows AI 콘텐츠 자동화"/>\n<meta property="og:description" content="'''+desc+'''"/>\n<meta property="og:image" content="https://sitehub.suaveforge.com/assets/namecard-default.png"/>\n<meta property="og:url" content="https://acs.suaveforge.com/"/>\n<meta property="og:site_name" content="SuaveForge"/>\n<meta name="twitter:card" content="summary_large_image"/>\n<script async src="https://sitehub.suaveforge.com/analytics-loader.js" data-sitehub-project="p10"></script>\n'''
          h=h.replace('</head>',block+'</head>',1); p.write_text(h,encoding='utf-8')
          PY
          git config user.name 'SuaveForge SiteHub'
          git config user.email '53187583+programmer119@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Integrate SiteHub p10' && git push)
